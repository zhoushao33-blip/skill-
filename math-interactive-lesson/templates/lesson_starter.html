<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__LESSON_TITLE__</title>
<style>
:root{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#152a46;background:#f8f9fa;--primary:#2563eb}
*{box-sizing:border-box}
body{margin:0}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
main{max-width:1250px;margin:auto;padding:22px}
h1{font-size:clamp(23px,3vw,36px);margin:8px 0}
h2{font-size:clamp(22px,2.3vw,28px)}
small,.note{color:#64748b}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.counter{color:var(--primary);font-weight:700;border-radius:16px;background:#eaf2ff;padding:12px 15px}
.progress{height:7px;background:#e2e8f0;border-radius:20px;margin:18px 0}
.progress>div{height:100%;background:var(--primary);border-radius:20px;transition:width .2s}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.tabs button,.nav button{background:#fff;border:1px solid #ced9e6;border-radius:10px;padding:10px 15px;font-weight:700}
.tabs button.current,.nav #next{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:18px}
.panel{border:1px solid #dce5f0;border-radius:17px;background:white;padding:22px;min-width:0}
.panel.lesson{display:flex;flex-direction:column;justify-content:space-between;gap:25px}
.think{padding:16px;background:#eff6ff;border-left:4px solid var(--primary);border-radius:10px;line-height:1.7}
#formula{font-weight:700;white-space:pre-wrap;line-height:1.65;font-size:clamp(19px,2vw,26px);overflow-wrap:anywhere;min-height:100px;padding:18px;border:1px solid #dce5f0;border-radius:12px;margin-top:15px}
.nav{display:flex;justify-content:space-between;gap:10px}
button:disabled{opacity:.4;cursor:default}
svg{display:block;width:100%;height:auto;max-height:450px;background:#fbfdff;border-radius:12px}
.lab{padding:16px;background:#f5faff;border:1px solid #dce5f0;border-radius:12px;margin-top:20px}
.lab input{width:100%;accent-color:var(--primary);margin:13px 0}
@media(max-width:850px){main{padding:12px}.grid{grid-template-columns:1fr}.panel{padding:15px}}
@media(prefers-reduced-motion:reduce){.progress>div{transition:none}}
</style></head>
<body><main>
<div class="top"><div><small>初中数学 · 离线互动课堂</small><h1>__LESSON_TITLE__</h1><p class="note">这个页面是模板演示；正式教学前必须替换题干、步骤、公式与图形。</p></div>
<div class="counter" id="counter">1 / 5</div></div>
<div class="progress"><div id="progress" style="width:20%"></div></div>
<nav class="tabs" aria-label="章节">
<button type="button" data-step="0" class="current">读题思路</button>
<button type="button" data-step="2">推导过程</button>
<button type="button" data-step="4">互动验证</button>
</nav>
<div class="grid">
<section class="panel lesson" aria-live="polite"><div>
<small id="stepTag">第 1 步</small><h2 id="stepTitle">理解条件</h2>
<div class="think"><strong>先想什么？</strong><div id="thinkText">题目中给出了哪些已知条件？</div></div>
<div id="formula">y = 2x + 1</div>
<p id="tip" class="note">先了解题意，再选择方法。</p>
</div><div class="nav">
<button type="button" id="prev">← 上一步</button>
<button type="button" id="next">下一步 →</button>
</div></section>
<section class="panel"><svg viewBox="0 0 620 420" role="img" aria-label="函数与动点的示例坐标图">
<line x1="40" y1="315" x2="590" y2="315" stroke="#64748b" stroke-width="2"/>
<line x1="300" y1="405" x2="300" y2="20" stroke="#64748b" stroke-width="2"/>
<text x="592" y="336" font-size="18" fill="#475569">x</text>
<text x="309" y="25" font-size="18" fill="#475569">y</text>
<path id="functionLine" d="M 100 405 L 450 55" fill="none" stroke="#2563eb" stroke-width="4"/>
<circle id="point" cx="0" cy="0" r="10" fill="#ef4444" stroke="#fff" stroke-width="2"/>
<text id="pointLabel" x="0" y="0" fill="#df3344" font-size="19" font-weight="bold">P</text>
</svg>
<div class="lab"><strong>动点实验（演示函数 y=2x+1）</strong>
<p class="note">改变横坐标，观察点、坐标与函数值同步变化。</p>
<label for="slider">x = <output id="xValue">1.0</output></label>
<input id="slider" type="range" min="-2" max="2" step="0.1" value="1"/>
<div id="result" aria-live="polite">P(1.0,3.0)</div>
<button type="button" id="resetPoint">重置 x=1</button>
</div></section></div>
<p class="note">注意：此处只是可运行模板，不能直接把示例公式用作真实试题答案。</p></main>
<script>
"use strict";
const steps=[
{title:"了解已知条件",think:"当前示例函数是什么？",formula:"y = 2x + 1",tip:"先弄清楚哪个是自变量。"},
{title:"选择解题方法",think:"知道 x 后，怎样计算 y？",formula:"把 x 代入函数。\n由 y = 2x + 1 求函数值。",tip:"先选方法，再计算。"},
{title:"计算第一个点",think:"当 x=0 时，y 等于多少？",formula:"y = 2×0 + 1 = 1",tip:"找到直线与 y 轴的交点。"},
{title:"计算第二个点",think:"当 x=1 时，y 等于多少？",formula:"y = 2×1 + 1 = 3",tip:"两点可以确定一条直线。"},
{title:"动手验证",think:"当 x 变化，点 P 会如何移动？",formula:"P(x, 2x+1)\n拖动滑块，观察坐标图。",tip:"让图形与数值来自同一公式。"}
];
const byId=id=>document.getElementById(id);
let step=0;
let x=1;
function draw(){
 const y=2*x+1,cx=300+x*55,cy=315-y*42;
 byId("point").setAttribute("cx",cx);
 byId("point").setAttribute("cy",cy);
 byId("pointLabel").setAttribute("x",cx+15);
 byId("pointLabel").setAttribute("y",cy-12);
 byId("xValue").textContent=x.toFixed(1);
 byId("result").textContent="P("+x.toFixed(1)+", "+y.toFixed(1)+")";
}
function render(){
 const current=steps[step];
 byId("stepTag").textContent="第 "+(step+1)+" 步";
 byId("stepTitle").textContent=current.title;
 byId("thinkText").textContent=current.think;
 byId("formula").textContent=current.formula;
 byId("tip").textContent=current.tip;
 byId("counter").textContent=(step+1)+" / "+steps.length;
 byId("progress").style.width=((step+1)/steps.length*100)+"%";
 byId("prev").disabled=step===0;
 byId("next").textContent=step===steps.length-1?"重新学习 ↺":"下一步 →";
 document.querySelectorAll("[data-step]").forEach(b=>b.classList.toggle("current",Number(b.dataset.step)===step));
 draw();
}
function go(n){step=Math.max(0,Math.min(n,steps.length-1));render();}
byId("prev").addEventListener("click",()=>go(step-1));
byId("next").addEventListener("click",()=>go(step===steps.length-1?0:step+1));
document.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.step))));
byId("slider").addEventListener("input",event=>{x=Number(event.target.value);draw();});
byId("resetPoint").addEventListener("click",()=>{x=1;byId("slider").value=x;draw();});
document.addEventListener("keydown",event=>{if(event.target.matches("input"))return;if(event.key==="ArrowRight")go(step+1);if(event.key==="ArrowLeft")go(step-1);});
render();
</script></body></html>
